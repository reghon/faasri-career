<div class="card bg-base-100 w-full max-w-3xl shadow-elevation-3 py-10 px-16 mt-12">
  <div class="card-body p-12 flex flex-col items-center">
    <div class="text-center mb-3">
      <h2 class="text-header-3">Periksa email Anda untuk mendapatkan kode</h2>
    </div>
    <div class="text-center flex flex-col gap-4">
      <div>
        <p class="text-body">Masukkan kode 6 digit yang kami kirim ke</p>
        <p class="text-body font-bold">{{ email }}</p>
      </div>
      <!-- OTP INPUT -->
      <div class="flex gap-3 w-full justify-center">
        @for (digit of otp; track $index) {
          <input
            #otpInput
            type="text"
            maxlength="1"
            inputmode="numeric"
            [value]="digit"
            (input)="onInput($index, $event)"
            (keydown)="onKeydown($index, $event)"
            class="input input-bordered w-14 h-14 text-center text-xl font-bold"
          />
        }
      </div>
      @if (errorMessage) {
        <p class="text-red-500 text-sm">{{ errorMessage }}</p>
      }
      <button class="btn btn-primary-faasri w-full" (click)="onVerify()" [disabled]="isLoading">
        {{ isLoading ? 'Memverifikasi...' : 'Masuk' }}
      </button>
      <div class="text-center text-medium">
        <p>Tidak dapat menemukannya?</p>
        <p>Tunggu sampai satu menit.</p>
        <p>Periksa spam atau <a href="#" class="text-link">kirim ulang kodenya.</a></p>
      </div>
      <a routerLink="/login" class="text-link">Kembali ke opsi masuk</a>
    </div>
  </div>
</div>
