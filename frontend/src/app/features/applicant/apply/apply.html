<div class="min-h-screen bg-blue-50 py-10">
  <div class="container-app flex justify-center">
    <div class="mx-auto w-full max-w-[820px]">
      <h1 class="mb-6 text-2xl font-bold text-base-content">Formulir Lamaran Pekerjaan</h1>

      <div class="card bg-base-100 p-8 shadow-sm">
        @if (isLoading) {
          <div class="flex min-h-[300px] items-center justify-center">
            <span class="loading loading-spinner loading-lg"></span>
          </div>
        } @else {
          <app-step-indicator
            [steps]="steps"
            [currentStep]="currentStep"
            (stepClick)="goToStep($event)"
          />

          @if (currentStep === 1) {
            <app-step1-personal [data]="personalInfo" (dataChange)="onPersonalInfoChange($event)" />
          }

          @if (currentStep === 2) {
            <app-step2-education
              [data]="educationInfo"
              (dataChange)="onEducationInfoChange($event)"
            />
          }

          @if (currentStep === 3) {
            <app-step3-experience
              [data]="experienceInfo"
              (dataChange)="onExperienceInfoChange($event)"
            />
          }

          @if (currentStep === 4) {
            <app-step4-review
              [personalInfo]="personalInfo"
              [educationInfo]="educationInfo"
              [experienceInfo]="experienceInfo"
            />
          }

          <div class="mt-8 flex justify-between">
            <button class="btn btn-ghost" (click)="prevStep()" [disabled]="currentStep === 1">
              Kembali
            </button>

            @if (currentStep < totalSteps) {
              <button class="btn btn-primary-faasri" (click)="nextStep()">Selanjutnya</button>
            } @else {
              <button class="btn btn-primary-faasri" (click)="submit()">Kirim Lamaran</button>
            }
          </div>
        }
      </div>
    </div>
  </div>
</div>
