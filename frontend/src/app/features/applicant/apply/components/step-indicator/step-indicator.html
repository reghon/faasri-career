<div class="flex flex-col md:flex-row md:items-center mb-8 min-w-0">
  @for (step of steps; track step.number) {
    <div
      class="flex flex-col md:flex-row md:items-center min-w-0"
      [class.flex-1]="step.number < steps.length"
    >
      <div
        class="flex items-center gap-2 cursor-pointer min-w-0"
        (click)="stepClick.emit(step.number)"
      >
        <!-- SELSAI -->
        @if (step.number < currentStep) {
          <div class="w-8 h-8 rounded-full bg-success flex items-center justify-center shrink-0">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-4 h-4 text-white"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5 13l4 4L19 7"
              />
            </svg>
          </div>
        }

        <!-- AKTIF -->
        @else if (step.number === currentStep) {
          <div
            class="w-8 h-8 rounded-full bg-blue-primary flex items-center justify-center shrink-0"
          >
            <span class="text-white text-sm font-bold">{{ step.number }}</span>
          </div>
        }

        <!-- NON-AKTIF -->
        @else {
          <div
            class="w-8 h-8 rounded-full border-2 border-base-300 flex items-center justify-center shrink-0"
          >
            <span class="text-base-content/40 text-sm">{{ step.number }}</span>
          </div>
        }

        <span
          class="text-sm ml-1 min-w-0 whitespace-normal break-words"
          [class.font-semibold]="step.number === currentStep"
          [class.text-base-content]="step.number <= currentStep"
          [class.text-base-content/40]="step.number > currentStep"
        >
          {{ step.label }}
        </span>
      </div>

      @if (step.number < steps.length) {
        <div
          class="w-px h-6 ml-4 my-2 bg-base-300 md:w-auto md:flex-1 md:h-px md:mx-3 md:my-0 min-w-0"
        ></div>
      }
    </div>
  }
</div>
