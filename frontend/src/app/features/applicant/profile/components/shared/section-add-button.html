<div class="flex justify-center">
  <button
    type="button"
    class="btn btn-ghost btn-sm text-primary color-blue-primary gap-1 mt-2"
    (click)="onClick()"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="w-4 h-4"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
    </svg>
    {{ label }}
  </button>
</div>
