<div class="min-h-screen bg-base-200/40">
  <div class="mx-auto flex max-w-7xl flex-col gap-4 p-4 md:p-6">
    <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>

    <div
      *ngIf="isLoading()"
      class="rounded-xl border border-base-300 bg-base-100 p-10 text-center shadow-sm"
    >
      Memuat detail pelamar...
    </div>

    <div
      *ngIf="!isLoading() && !applicantMaster()"
      class="rounded-xl border border-base-300 bg-base-100 p-10 text-center shadow-sm"
    >
      <h2 class="text-lg font-semibold">Data applicant tidak ditemukan</h2>
      <p class="mt-1 text-sm text-base-content/70">
        Applicant detail belum tersedia atau gagal dimuat.
      </p>

      <button class="btn btn-sm mt-4" type="button" (click)="goBack()">Kembali</button>
    </div>

    <ng-container *ngIf="!isLoading() && applicantMaster() as master">
      <app-applicant-detail-header
        [profile]="applicantProfile()"
        [activeTab]="activeTab()"
        (tabChange)="setActiveTab($event)"
      ></app-applicant-detail-header>

      <div class="min-h-[620px] rounded-xl border border-base-300 bg-base-100 p-5 shadow-xl">
        <app-applicant-detail-profile
          *ngIf="activeTab() === 'profile'"
          [master]="master"
        ></app-applicant-detail-profile>

        <app-applicant-detail-application
          *ngIf="activeTab() === 'applications'"
        ></app-applicant-detail-application>

      </div>
    </ng-container>
  </div>
</div>
