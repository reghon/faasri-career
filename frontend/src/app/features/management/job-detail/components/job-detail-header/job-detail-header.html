<div class="overflow-hidden rounded-xl border border-base-300 bg-base-100 shadow-sm">
  <div class="flex flex-col gap-4 p-5 lg:flex-row lg:items-start lg:justify-between">
    <div class="flex-1">
      <div class="flex flex-wrap items-center gap-3">
        <h1 class="text-2xl font-bold text-base-content">
          {{ job.title }}
        </h1>

        <div
          class="badge rounded-md border-0 px-3 py-3 font-medium"
          [ngClass]="getStatusBadgeClass(job.status)"
        >
          {{ getDisplayStatus(job.status) }}
        </div>
      </div>

      <div class="mt-3 flex flex-wrap items-center gap-x-6 gap-y-2 text-sm text-base-content/70">
        <div class="flex items-center gap-2">
          <span>📍</span>
          <span>{{ job.location || '-' }}</span>
        </div>

        <div class="flex items-center gap-2">
          <span>👤</span>
          <span>{{ job.managementProfile }}</span>
        </div>
      </div>
    </div>

    <div class="flex flex-col gap-4 lg:items-end">
      <div class="flex flex-wrap items-center gap-3 text-sm">
        <div class="flex items-center gap-1">
          <span class="text-base-content/70">Applicants</span>
          <span class="font-semibold text-info">{{ applicantsCount }}</span>
        </div>

        <div class="text-base-content/30">|</div>

        <div class="flex items-center gap-1">
          <span class="text-base-content/70">Rejected</span>
          <span class="font-semibold text-error">{{ rejectedCount }}</span>
        </div>

        <div class="text-base-content/30">|</div>

        <div class="flex items-center gap-1">
          <span class="text-base-content/70">In Progress</span>
          <span class="font-semibold text-secondary">{{ inProgressCount }}</span>
        </div>

        <div class="text-base-content/30">|</div>

        <div class="flex items-center gap-1">
          <span class="text-base-content/70">Hired</span>
          <span class="font-semibold text-success">{{ hiredCount }}</span>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        @if (canUpdate) {
          <button
            type="button"
            class="btn btn-primary-faasri btn-sm rounded-lg"
            (click)="onEditJob()"
          >
            Edit Job
          </button>
        }
      </div>
    </div>
  </div>

  <div class="border-t border-base-300 px-5">
    <div class="tabs tabs-bordered">
      @for (tab of tabs; track tab.value) {
        <button
          type="button"
          class="tab"
          [ngClass]="{
            'tab-active !text-[var(--color-brand-primary)]': activeTab === tab.value,
          }"
          (click)="setTab(tab.value)"
        >
          {{ tab.label }}
        </button>
      }
    </div>
  </div>
</div>
