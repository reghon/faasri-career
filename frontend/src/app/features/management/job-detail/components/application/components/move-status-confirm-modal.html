@if (isOpen) {
  <div class="modal modal-open">
    <div class="modal-box max-w-md rounded-2xl">
      <h3 class="text-lg font-bold text-base-content">Perbarui Status Lamaran</h3>

      <p class="mt-2 text-md leading-6 text-base-content/70">
        {{ message }}
      </p>

      <form (ngSubmit)="onConfirm()">
        <div class="mt-4">
          <label class="label mb-2">
            <span class="label-text text-md">
              Catatan

              @if (requireNotes) {
                <span class="text-error">*</span>
              }
            </span>
          </label>

          <textarea
            name="notes"
            class="textarea textarea-bordered min-h-28 w-full rounded-xl text-md"
            [class.textarea-error]="isSubmitted && notesInvalid"
            placeholder="Tuliskan catatan..."
            [(ngModel)]="notes"
            [disabled]="isLoading"
          ></textarea>

          @if (isSubmitted && notesInvalid) {
            <p class="mt-1 text-sm text-error">Catatan wajib diisi.</p>
          }
        </div>

        <div class="modal-action">
          <button
            type="button"
            class="btn btn-ghost rounded-xl"
            [disabled]="isLoading"
            (click)="onClose()"
          >
            Batal
          </button>

          <button type="submit" class="btn btn-primary rounded-xl" [disabled]="isLoading">
            @if (isLoading) {
              <span class="loading loading-spinner loading-sm"></span>
            }

            Simpan
          </button>
        </div>
      </form>
    </div>

    <button type="button" class="modal-backdrop" [disabled]="isLoading" (click)="onClose()">
      Tutup
    </button>
  </div>
}
