<section class="space-y-4 border-t border-base-300 pt-6">
  <div>
    <h3 class="text-base font-semibold text-base-content">Lokasi & Pola Kerja</h3>
    <p class="mt-1 text-sm text-base-content/60">
      Atur lokasi kerja dan mode pelaksanaan pekerjaan.
    </p>
  </div>

  <div class="grid grid-cols-1 gap-4 md:grid-cols-6">
    <div class="form-control md:col-span-3">
      <app-select
        label="Lokasi Kerja"
        name="jobLocationId"
        [(model)]="form.jobLocationId"
        [options]="toOptions(jobLocations)"
        placeholder="Pilih lokasi kerja"
        [error]="errors['jobLocationId']"
      />
    </div>

    <div class="form-control md:col-span-3">
      <app-select
        label="Mode Kerja"
        name="workModeId"
        [(model)]="form.workModeId"
        [options]="toOptions(workModes)"
        placeholder="Pilih Mode Kerja"
        [error]="errors['workModeId']"
      />
    </div>
  </div>
</section>
