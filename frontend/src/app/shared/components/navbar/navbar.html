<nav
  class="navbar fixed left-0 right-0 top-0 z-50 border-b border-base-300 px-6 transition-all duration-300 h-[72px]"
  [class.bg-base-100]="isWhite"
  [class.bg-transparent]="!isWhite"
  [class.border-transparent]="!isWhite"
  [class.shadow-none]="isManagement || !isWhite"
  [class.shadow-elevation-3]="isWhite"
>
  <div class="container-app flex w-full items-center justify-between">
    <!-- LOGO -->
    <div class="flex items-center">
      <a href="/" class="inline-flex items-center gap-2">
        <img
          [src]="isWhite ? 'faasri_career_logo.png' : 'faasri_career_logo_light.png'"
          alt="Faasri Careers"
          class="h-10"
        />
      </a>
    </div>

    <div class="flex justify-center flex-1" *ngIf="isManagement">
      <ul class="flex h-14 items-center gap-8 text-[15px] font-medium text-base-content">
        <li>
          <a
            routerLink="/management/dashboard"
            routerLinkActive="color-blue-primary"
            class="transition-colors duration-200 hover-color-blue-primary"
          >
            Dashboard
          </a>
        </li>
        <li>
          <a
            routerLink="/management/applicant"
            routerLinkActive="color-blue-primary"
            class="transition-colors duration-200 hover-color-blue-primary"
          >
            Applicant
          </a>
        </li>
        <li>
          <a
            routerLink="/management/job"
            routerLinkActive="color-blue-primary"
            class="transition-colors duration-200 hover-color-blue-primary"
          >
            Job
          </a>
        </li>
        <li>
          <a
            routerLink="/management/application"
            routerLinkActive="color-blue-primary"
            class="transition-colors duration-200 hover-color-blue-primary"
          >
            Application
          </a>
        </li>
        <li>
          <a
            routerLink="/management/master-data"
            routerLinkActive="color-blue-primary"
            class="transition-colors duration-200 hover-color-blue-primary"
          >
            Master Data
          </a>
        </li>
        <li>
          <a
            routerLink="/management/admin"
            routerLinkActive="color-blue-primary"
            class="transition-colors duration-200 hover-color-blue-primary"
          >
            Admin
          </a>
        </li>
      </ul>
    </div>

    <!-- MENU: belum login -->
    <div class="flex items-center gap-4" *ngIf="!isLoggedIn">
      <a routerLink="/register" class="btn btn-ghost font-semibold" [class.text-white]="!isWhite">
        Sign Up
      </a>
      <a routerLink="/login" class="btn btn-ghost font-semibold" [class.text-white]="!isWhite">
        Login
      </a>
    </div>

    <!-- MENU: sudah login -->
    <div class="flex items-center gap-4" *ngIf="isLoggedIn">
      <a
        *ngIf="!isManagement"
        routerLink="/"
        class="btn btn-ghost font-semibold"
        [class.text-white]="!isWhite"
      >
        Home
      </a>

      <button class="btn btn-ghost btn-circle" [class.text-white]="!isWhite">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            d="M12 2a6 6 0 0 0-6 6v3.586L4.293 13.293A1 1 0 0 0 5 15h14a1 1 0 0 0 .707-1.707L18 11.586V8a6 6 0 0 0-6-6zm0 20a3 3 0 0 0 2.995-2.824L15 19h-6a3 3 0 0 0 3 3z"
          />
        </svg>
      </button>

      <div class="dropdown dropdown-end">
        <div
          tabindex="0"
          role="button"
          class="flex cursor-pointer items-center gap-2 rounded-lg px-2 py-1 transition hover:bg-base-200"
        >
          <div class="avatar">
            <div class="w-8 rounded-full bg-base-300 flex items-center justify-center">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-5 h-5 text-base-content/50"
                fill="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"
                />
              </svg>
            </div>
          </div>

          <span class="text-sm font-semibold" [class.text-white]="!isWhite">{{ displayName }}</span>

          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-4 h-4"
            [class.text-white]="!isWhite"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </div>

        <ul
          tabindex="0"
          class="dropdown-content menu z-50 mt-2 w-48 rounded-box bg-base-100 p-2 shadow-lg"
        >
          <li><a routerLink="/profile">Profile</a></li>

          <ng-container *ngIf="isManagement; else publicMenu">
            <li><a routerLink="/settings">Settings</a></li>
          </ng-container>

          <ng-template #publicMenu>
            <li><a routerLink="/saved-jobs">Lamaran Disimpan</a></li>
            <li><a routerLink="/settings">Riwayat Lamaran</a></li>
            <li><a routerLink="/settings">Settings</a></li>
          </ng-template>

          <li><hr class="my-1" /></li>
          <li><a class="text-error" (click)="logout()">Logout</a></li>
        </ul>
      </div>
    </div>
  </div>
</nav>
