<div class="flex items-center justify-between gap-4 border-t border-base-300 px-5 py-4 flex-wrap">
  <div class="flex items-center gap-2 whitespace-nowrap">
    <span class="text-sm">Rows per page:</span>
    <select
      class="select select-bordered h-10 rounded-xl px-3 pr-8 text-sm"
      [ngModel]="pageSize"
      (ngModelChange)="onPageSizeModelChange($event)"
    >
      @for (size of pageSizeOptions; track size) {
        <option [ngValue]="size">{{ size }}</option>
      }
    </select>
  </div>

  <div class="flex flex-col items-start gap-2 md:flex-row md:items-center">
    <span class="text-sm text-base-content/70">
      Showing {{ startEntry }} to {{ endEntry }} of {{ totalItems }} entries
    </span>

    <div class="join">
      <button
        class="join-item btn btn-sm"
        type="button"
        [disabled]="currentPage === 1"
        (click)="goToPage(currentPage - 1)"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6" />
        </svg>
      </button>

      @for (page of visiblePages; track page) {
        <button
          class="join-item btn btn-sm"
          type="button"
          [class.btn-primary-faasri]="page === currentPage"
          [class.btn-outline]="page !== currentPage"
          (click)="goToPage(page)"
        >
          {{ page }}
        </button>
      }

      <button
        class="join-item btn btn-sm"
        type="button"
        [disabled]="currentPage === totalPages"
        (click)="goToPage(currentPage + 1)"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="m9 6 6 6-6 6" />
        </svg>
      </button>
    </div>
  </div>
</div>
