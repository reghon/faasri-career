@if (isOpen) {
  <dialog class="modal modal-open">
    <div class="modal-box">
      <h3 class="font-bold text-lg">{{ title }}</h3>
      <p class="py-4 text-sm text-base-content/70">{{ message }}</p>
      <div class="modal-action">
        <button class="btn btn-ghost btn-sm" (click)="cancelled.emit()">{{ cancelLabel }}</button>
        <button class="btn btn-error btn-sm" (click)="confirmed.emit()">{{ confirmLabel }}</button>
      </div>
    </div>
    <div class="modal-backdrop" (click)="cancelled.emit()"></div>
  </dialog>
}
