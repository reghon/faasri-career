<div class="flex items-center justify-end cursor-pointer p-2">
  @if (showView) {
    <button
      type="button"
      class="cursor-pointer p-2 rounded-lg text-primary hover:bg-base-200 transition"
      (click)="view.emit()"
      title="View"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
        />
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
        />
      </svg>
    </button>
  }

  @if (useDropdown) {
    <div class="dropdown dropdown-end">
      <button type="button" tabindex="0" class="btn btn-ghost btn-sm btn-circle" title="Actions">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 6.75h.01M12 12h.01M12 17.25h.01"
          />
        </svg>
      </button>

      <ul
        tabindex="0"
        class="dropdown-content z-[9999] menu w-44 rounded-xl border border-base-300 bg-base-100 p-2 shadow-lg"
      >
        @for (action of actions; track action.value) {
          <li>
            <button
              type="button"
              class="text-sm"
              [ngClass]="action.class"
              [disabled]="action.disabled"
              (click)="onActionClick(action)"
            >
              {{ action.label }}
            </button>
          </li>
        }
      </ul>
    </div>
  } @else {
    @if (showEdit) {
      <button
        type="button"
        class="cursor-pointer p-2 rounded-lg text-orange-300 hover:bg-base-200 transition"
        (click)="edit.emit()"
        title="Edit"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M16.862 4.487a2.121 2.121 0 113 3L7.5 19.5 3 21l1.5-4.5 12.362-12.013z"
          />
        </svg>
      </button>
    }

    @if (showDelete) {
      <button
        type="button"
        class="cursor-pointer p-2 rounded-lg text-error hover:bg-base-200 transition"
        (click)="delete.emit()"
        title="Delete"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 7h12M9 7V4h6v3m-8 0l1 12h8l1-12"
          />
        </svg>
      </button>
    }
  }
</div>
