<div>
  <label class="mb-1 block text-sm font-medium text-base-content">
    {{ label() }}
  </label>

  <div class="relative">
    <input
      [type]="showPassword() ? 'text' : 'password'"
      class="input input-bordered w-full pr-14"
      [class.input-error]="isMismatch()"
      [class.input-success]="isMatch()"
      [placeholder]="placeholder()"
      [value]="confirmPassword()"
      (input)="onInput($any($event.target).value)"
    />

    <button
      type="button"
      class="btn btn-ghost btn-sm absolute right-1 top-1/2 -translate-y-1/2"
      (click)="showPassword.set(!showPassword())"
    >
      {{ showPassword() ? 'Hide' : 'Show' }}
    </button>
  </div>

  @if (isMismatch()) {
    <p class="mt-1 text-xs text-error">Password konfirmasi tidak sama</p>
  }

  @if (isMatch()) {
    <p class="mt-1 text-xs text-success">✓ Password cocok</p>
  }
</div>
