<a
  [routerLink]="['/job', job.slug]"
  class="card bg-base-100 border border-base-200 shadow-[0_2px_10px_rgba(0,0,0,0.06)] hover:shadow-[0_12px_24px_-8px_rgba(0,0,0,0.12)] hover:-translate-y-1 transition-all duration-300 cursor-pointer p-4 flex flex-col h-full"
>
  <!-- HEADER -->
  <div class="flex items-start justify-between">
    <p class="text-header-4 leading-snug max-w-[80%]">{{ job.title }}</p>
    <span class="text-xs text-base-content/40 whitespace-nowrap"></span>
  </div>

  <!-- CATEGORY -->
  <p class="text-body color-yellow-primary mb-0.5">{{ job.category }}</p>

  <!-- Location + Work Type Badge -->
  <div class="flex items-center gap-2 text-xs text-base-content/60 mt-1">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="w-3 h-3 shrink-0"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M12 2C8.686 2 6 4.686 6 8c0 5.25 6 13 6 13s6-7.75 6-13c0-3.314-2.686-6-6-6z"
      />
      <circle cx="12" cy="8" r="2" fill="currentColor" />
    </svg>
    <span class="flex items-center gap-2 text-sm text-base-content/60">{{ job.location }}</span>
    <span class="badge badge-info badge-sm text-white">{{ job.workType }}</span>
  </div>

  <!-- JOB TYPE -->
  <div class="flex items-center gap-2 text-sm text-base-content/60 mt-1">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="w-3 h-3 shrink-0"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2z"
      />
    </svg>
    <span>{{ job.jobType }}</span>
  </div>

  <!-- SALARY -->
  <div class="flex items-center gap-2 text-sm font-medium color-blue-primary mt-1">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="w-3 h-3 shrink-0"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M12 8c-1.657 0-3 1.343-3 3s1.343 3 3 3 3-1.343 3-3-1.343-3-3-3zm0-5C6.477 3 2 7.477 2 13s4.477 10 10 10 10-4.477 10-10S17.523 3 12 3z"
      />
    </svg>
    <span>{{ job.salary }}</span>
  </div>

  <!-- Footer -->
  <div class="mt-auto">
    <div class="divider my-2"></div>
    <div class="flex items-center gap-2 text-xs text-base-content/50 overflow-hidden">
      <span class="shrink-0">{{ job.experience }}</span>
      <span class="shrink-0">|</span>
      <span class="truncate">{{ getSkillsLabel(job.skills) }}</span>
    </div>
  </div>
</a>
