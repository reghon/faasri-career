@if (isLoading$ | async) {
  <div class="fixed inset-0 z-[9999] bg-base-100/80 backdrop-blur-sm">
    <div class="h-full w-full p-6">
      <div class="mx-auto max-w-7xl space-y-6">
        <div class="flex items-center justify-between">
          <div class="space-y-2">
            <div class="h-6 w-48 animate-pulse rounded-lg bg-base-300"></div>
            <div class="h-4 w-72 animate-pulse rounded-lg bg-base-300"></div>
          </div>

          <div class="h-10 w-32 animate-pulse rounded-lg bg-base-300"></div>
        </div>

        <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
          <div class="h-28 animate-pulse rounded-xl bg-base-300"></div>
          <div class="h-28 animate-pulse rounded-xl bg-base-300"></div>
          <div class="h-28 animate-pulse rounded-xl bg-base-300"></div>
        </div>

        <div class="rounded-xl border border-base-300 bg-base-100 p-4 shadow-sm">
          <div class="mb-4 h-10 w-full animate-pulse rounded-lg bg-base-300"></div>

          <div class="space-y-3">
            <div class="h-12 animate-pulse rounded-lg bg-base-300"></div>
            <div class="h-12 animate-pulse rounded-lg bg-base-300"></div>
            <div class="h-12 animate-pulse rounded-lg bg-base-300"></div>
            <div class="h-12 animate-pulse rounded-lg bg-base-300"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
}
